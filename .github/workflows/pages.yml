# War Room (web/) → GitHub Pages.
# Contract: specs/015-web-pages-deploy/contracts/pages-workflow.md
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
      # web tests import these fixtures
      - "specs/014-war-room-web/contracts/fixtures/**"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
      - "specs/014-war-room-web/contracts/fixtures/**"
  workflow_dispatch:

# Read-only by default; only the deploy job may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Stale PR builds are cancelled; pushes and manual runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test

      - name: Build
        run: npm --prefix web run build
        env:
          # Project site: https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public repository variable (never a secret); unset → http://localhost:3000.
          VITE_OPSPILOT_API_URL: ${{ vars.OPSPILOT_API_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time; never cancel one in progress.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
